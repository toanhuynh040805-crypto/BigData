name: Refresh Word and PowerPoint from published UCI results

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_deliverables.py
      - .github/workflows/refresh-reports.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight report libraries
        run: |
          pip install "pandas>=2.1,<3" "matplotlib>=3.8,<4" "python-docx>=1.1,<2" "python-pptx>=1.0,<2"
      - name: Verify source is actual UCI results
        run: |
          python -c "import json; m=json.load(open('results/uci/metrics.json')); assert m['status']=='trained' and m['data_provenance']=='uci'"
      - name: Regenerate reports
        run: python scripts/build_deliverables.py --input results/uci --output deliverables
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: bigdata-word-ppt-uci
          retention-days: 90
          path: |
            deliverables/Bao_cao_BigData_Dien_nang.docx
            deliverables/Slide_BigData_Dien_nang.pptx
      - name: Update report files in repository
        run: |
          cp deliverables/Bao_cao_BigData_Dien_nang.docx reports/
          cp deliverables/Slide_BigData_Dien_nang.pptx reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Word and PowerPoint using verified UCI results [skip ci]"
            git push origin HEAD:main
          fi
